name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release --locked -p asc
      - name: package
        run: |
          strip target/release/asc
          tar -C target/release -czf asc-linux-x86_64.tar.gz asc
      - uses: softprops/action-gh-release@v2
        with:
          files: asc-linux-x86_64.tar.gz
          generate_release_notes: true
